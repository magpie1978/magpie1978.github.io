<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zulu Orchid Falcon | My Projects</title>

  <!-- Prevent protected content from flashing before authentication finishes. -->
  <style>
    html:not(.authenticated) body {
      visibility: hidden;
    }
  </style>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1019;
      color: #f4f6fa;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Large, centred ZOF logo header. */
    .site-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 90px;
      min-height: 300px;
      background: #111111;
      border-bottom: 1px solid #2a2a2a;
    }

    .site-logo {
      display: block;
      width: min(72vw, 760px);
      max-height: 260px;
      height: auto;
      object-fit: contain;
    }

    #signOut {
      position: absolute;
      right: 30px;
      top: 30px;
    }

    @media (max-width: 600px) {
      .site-header {
        min-height: 210px;
        padding: 62px 16px 24px;
      }

      .site-logo {
        width: min(94vw, 520px);
        max-height: 190px;
      }

      #signOut {
        top: 12px;
        right: 12px;
      }
    }

    #signOut {
      background: #171e2b;
      border: 1px solid #303846;
      border-radius: 8px;
      color: #f4f6fa;
      padding: 10px 18px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      padding: 28px;
      background: #171e2b;
      border: 1px solid #303846;
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #a3e635;
    }

    .card:focus-visible {
      outline: 2px solid #a3e635;
      outline-offset: 3px;
    }

    .card h2 {
      font-size: 20px;
      margin: 0 0 10px;
    }

    .card p {
      color: #9ca3af;
      line-height: 1.5;
    }

    .card span {
      color: #a3e635;
      font-size: 14px;
    }

    /* Logo-only project card: no text, padding, or coloured panel. */
    .card--logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      background: transparent;
      border-color: transparent;
    }

    .card--logo img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 320px;
      object-fit: contain;
    }

    footer {
      text-align: center;
      padding: 55px 20px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <img class="site-logo" src="./zof_logo.png" alt="Zulu Orchid Falcon">
    <button id="signOut" type="button">Sign Out</button>
  </header>

  <main>
    <div class="grid">
      <a
        class="card card--logo"
        href="https://myjourneys.zulu-orchid-falcon.co.uk/"
        aria-label="Explore MyJourneys website"
      >
        <img
          src="./myjourneys_logo.png"
          alt="MyJourneys"
          loading="lazy"
        >
      </a>

      <a
        class="card card--logo"
        href="https://airlines-manager.zulu-orchid-falcon.co.uk/"
        aria-label="Explore Airlines Manager website"
      >
        <img
          src="./airlines_manager_logo.png"
          alt="Airlines Manager"
          loading="lazy"
        >
      </a>

      <a
        class="card card--logo"
        href="https://victorias-descendants.zulu-orchid-falcon.co.uk/"
        aria-label="Explore Victoria's Descendants website"
      >
        <img
          src="./qvd_logo.png"
          alt="Queen Victoria's Descendants"
          loading="lazy"
        >
      </a>

      <a
        class="card card--logo"
        href="https://finance-calculators.zulu-orchid-falcon.co.uk/"
        aria-label="Explore Finance Calculators website"
      >
        <img
          src="./finance_calculators_logo.png"
          alt="Finance Calculators"
          loading="lazy"
        >
      </a>

      <a
        class="card card--logo"
        href="https://pornflix.zulu-orchid-falcon.co.uk/"
        aria-label="Explore Pornflix website"
      >
        <img
          src="./pornflix_logo.png"
          alt="Pornflix"
          loading="lazy"
        >
      </a>
    </div>
  </main>

  <footer>© 2026 Zulu Orchid Falcon</footer>

  <script type="module" src="./dashboard-auth.js"></script>
</body>
</html>
