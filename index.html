<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign In | Project Zulu</title>
<style>
:root{color-scheme:dark;--red:#ed172b;--muted:#9da3ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#211016 0%,#0b0c10 55%,#060608 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}.panel{width:min(100%,440px);padding:36px 34px 32px;border:1px solid #343038;border-radius:18px;background:#141419;box-shadow:0 28px 80px #0008}.logo{display:block;width:100%;height:auto;margin:0 auto 20px;filter:drop-shadow(0 3px 18px #e8172920)}h1{font-size:25px;letter-spacing:-.5px;margin:0 0 6px;text-align:center}p.subtitle{color:var(--muted);text-align:center;font-size:14px;margin:0 0 30px}label{display:block;margin:0 0 8px;font-size:13px;font-weight:600}input{display:block;width:100%;border:1px solid #40404a;border-radius:9px;background:#0b0c10;color:#fff;padding:14px 15px;font:inherit;outline:none}input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ed172b22}.field{margin-bottom:19px}button{width:100%;border:0;border-radius:9px;background:var(--red);color:white;font:700 15px system-ui;padding:15px;cursor:pointer;margin-top:6px}button:hover:not(:disabled){background:#d41124}button:disabled{opacity:.65;cursor:wait}.error{min-height:22px;color:#ff929b;font-size:13px;margin:0 0 6px;text-align:center}.foot{margin-top:27px;color:#74747e;text-align:center;font-size:12px}@media(max-width:480px){.panel{padding:28px 22px}}
</style>
</head>
<body><main class="panel"><img class="logo" src="./project-zulu-logo.png" alt="PROJECT ZULU"><h1>Welcome back</h1><p class="subtitle">Sign in to access your projects</p><form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p id="error" class="error" role="alert" aria-live="polite"></p><button type="submit">Sign In</button></form><div class="foot">© 2026 Project Zulu</div></main><script type="module" src="./login.js"></script></body></html>
